services:
  db:
    image: postgres:15-alpine
    container_name: crime_postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: crime_admin
      POSTGRES_PASSWORD: crime_password
      POSTGRES_DB: crime_intelligence
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crime_admin -d crime_intelligence"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: crime_fastapi_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://crime_admin:crime_password@db:5432/crime_intelligence
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: crime_nextjs_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
